<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Warnów – Rekru Team</title>

<style>

*{box-sizing:border-box;font-family:Segoe UI}

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
margin:0;
padding:40px;
text-align:center;
}

h1{
font-size:38px;
margin-bottom:30px;
}

button{
background:#22d3ee;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:5px;
}

button:hover{
opacity:.85;
}

.panel{
background:rgba(255,255,255,.05);
padding:20px;
border-radius:12px;
width:350px;
margin:auto;
margin-top:20px;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:6px;
}

.result{
background:rgba(255,255,255,.05);
padding:12px;
border-radius:8px;
margin-top:10px;
text-align:left;
}

.warn{
background:rgba(255,255,255,.06);
padding:10px;
border-radius:8px;
margin-top:8px;
}

.delete{
background:#ef4444;
margin-top:5px;
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#0f172a;
padding:25px;
border-radius:15px;
display:none;
width:340px;
box-shadow:0 0 25px rgba(0,0,0,.6);
}

.close{
background:#ef4444;
}

</style>
</head>

<body>

<h1>System Warnów – Rekru Team</h1>

<button onclick="openLogin()">⚠ Panel Admina</button>
<button onclick="openCheck()">❗ Sprawdź UID</button>

<!-- LOGIN -->

<div class="popup" id="login">

<h3>Panel Admina</h3>

<input type="password" id="adminPass" placeholder="Hasło">

<button onclick="login()">Zaloguj</button>
<button class="close" onclick="closeLogin()">Zamknij</button>

</div>

<!-- DODAWANIE WARNA -->

<div class="popup" id="addPanel">

<h3>Dodaj warna</h3>

<input id="uid" placeholder="UID">

<input id="tier" placeholder="Tier">

<input id="reason" placeholder="Przewinienie (np A.1)">

<div id="userName"></div>

<button onclick="addWarn()">Dodaj warna</button>
<button class="close" onclick="closeAdd()">Zamknij</button>

</div>

<!-- SPRAWDZ UID -->

<div class="popup" id="checkPanel">

<h3>Sprawdź UID</h3>

<input id="checkUid" placeholder="UID">

<button onclick="checkUser()">Sprawdź</button>

<div id="result" class="result"></div>

<button class="close" onclick="closeCheck()">Zamknij</button>

</div>

<script>

const BIN_ID="69ad89dbd0ea881f40fca797"
const API_KEY="$2a$10$Er4xDqMuTh2Mr5HpTj11dONOsG.FENlRMPKk6ByJ6J/9mQw717iiS"

let data=[]

/* przykładowa lista z panelu Rekru */

let rekruUsers=[
{uid:"61069",name:"Jan Kowalski"},
{uid:"61070",name:"Adam Nowak"},
{uid:"61071",name:"Piotr Zieliński"}
]

/* POBIERANIE BAZY */

async function loadData(){

let res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{
"X-Master-Key":API_KEY
}
})

let json=await res.json()

data=json.record.warny || []

}

/* ZAPIS BAZY */

async function saveData(){

await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Master-Key":API_KEY
},
body:JSON.stringify({warny:data})
})

}

/* LOGIN ADMINA */

function openLogin(){
document.getElementById("login").style.display="block"
}

function closeLogin(){
document.getElementById("login").style.display="none"
}

function login(){

let pass=document.getElementById("adminPass").value

if(pass==="rekruadmin"){

closeLogin()
document.getElementById("addPanel").style.display="block"

}else{

alert("Złe hasło")

}

}

/* DODAWANIE WARNA */

function closeAdd(){
document.getElementById("addPanel").style.display="none"
}

async function addWarn(){

await loadData()

let uid=document.getElementById("uid").value
let tier=document.getElementById("tier").value
let reason=document.getElementById("reason").value

let user=rekruUsers.find(u=>u.uid===uid)

if(!user){
alert("Nie znaleziono UID")
return
}

let date=new Date().toISOString().split("T")[0]

data.push({

id:Date.now(),
uid:uid,
name:user.name,
tier:tier,
reason:reason,
date:date

})

await saveData()

alert("Warn dodany")

}

/* SPRAWDZANIE UID */

function openCheck(){
document.getElementById("checkPanel").style.display="block"
}

function closeCheck(){
document.getElementById("checkPanel").style.display="none"
}

async function checkUser(){

await loadData()

let uid=document.getElementById("checkUid").value

let userWarns=data.filter(w=>w.uid===uid)

if(userWarns.length===0){

document.getElementById("result").innerHTML="Brak warnów"

return
}

let name=userWarns[0].name

let html=`

<b>UID:</b> ${uid}<br>
<b>Imię i Nazwisko:</b> ${name}<br>
<b>Warny:</b> ${userWarns.length}<br><br>

`

userWarns.forEach((w,i)=>{

html+=`
<div class="warn">

${i+1}. Tier ${w.tier} — ${w.reason}<br>
Data: ${w.date}<br>

<button class="delete" onclick="deleteWarn(${w.id})">
Usuń
</button>

</div>
`

})

document.getElementById("result").innerHTML=html

}

/* USUWANIE WARNA */

async function deleteWarn(id){

await loadData()

data=data.filter(w=>w.id!==id)

await saveData()

alert("Warn usunięty")

checkUser()

}

loadData()

</script>

</body>
</html>
